name: Evari
kind: company
description: Evari is an insurance technology company founded in Sydney by Daniel Fogarty
  (former CEO of Zurich Australia and New Zealand), Robert Jeffery and Brack Norris,
  and now operating as Evari Services UK Ltd. It launched as a digital small-business
  and trades insurance brand at evari.insure, a Lloyd's coverholder with direct and
  partner distribution, then moved upstream into core systems with CloudStream, a
  cloud-native policy administration platform covering quote, bind and issue through
  endorsement, renewal and cancellation, broker and MGA portals, appetite and
  eligibility rules, commission tracking and policyholder self-service. Its current
  positioning is insurance AI operations for brokers, MGAs and insurers, delivered as
  30-day assistant deployment sprints powered by the third-party QuivaWorks platform.
  Evari publishes no developer portal and no API reference, and every running API host
  is tenant-scoped and closed - api.cloudstream.evari.tech returns 404 unauthenticated,
  api.envest.evari.tech returns 502, and the customer and admin applications are login
  walls. One real first-party contract does exist off-portal - Evari published its
  Quotes microservice to npm as evari-quotes-api, and that tarball ships a generated
  Swagger 2.0 document of 49 paths and 56 operations plus a draft-07 JSON Schema set of
  369 definitions, both harvested here. Evari is otherwise a consumer of other vendors'
  APIs, integrating into Socotra, Vertafore AMS360 and Sagitta, Applied Epic and
  Guidewire read access, and no ACORD, AL3 or IVANS reference appears anywhere on its
  site, in its help centre or in its data model.
