apis:
- name: Evari Quotes API
  description: The Evari Quotes microservice - the internal broker and underwriter
    quoting surface at /api/quotes/** plus a customer-facing mirror at
    /api/quotes/public/**. 49 paths, 56 operations and 70 definitions covering quote
    create/read/patch, product questions, validation, pricing with first-class price
    errors, quote options, SMS and code confirmation, PDF issue, attachments, mid-term
    endorsements with a structured diff model, referral to a human underwriter with
    notes and cover price overrides, and per-product quote-date configuration. Auth is
    a single apiKey carried in the Authorization header. NOT SELF-SERVE - this spec was
    harvested from the Swagger document Evari bundled in its own evari-quotes-api npm
    tarball, not from a developer portal; the API is tenant-scoped and the only API
    root named in a first-party build config returns 404 unauthenticated.
  humanURL: https://www.npmjs.com/package/evari-quotes-api
  baseURL: https://api.cloudstream.evari.tech/
