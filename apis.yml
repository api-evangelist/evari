name: Evari
kind: company
description: Evari is an Australian insurance technology company, founded in Sydney
  by Daniel Fogarty (former CEO of Zurich Australia and New Zealand), Robert Jeffery
  and Brack Norris. It launched as a digital small-business and trades insurance
  brand at evari.insure, operating as a Lloyd's coverholder with direct and partner
  distribution, then moved upstream into core systems with CloudStream, a cloud-native
  policy administration platform covering quote, bind and issue through endorsement,
  renewal and cancellation, broker and MGA portals, appetite and eligibility rules,
  commission tracking and policyholder self-service. Its current positioning is
  insurance AI operations for brokers, MGAs and insurers, delivered as 30-day
  assistant deployment sprints powered by the third-party QuivaWorks platform.
  Evari publishes no public developer portal and no downloadable OpenAPI. Every API
  surface found is tenant-scoped and closed - api.cloudstream.evari.tech and its
  /api/docs path return 404 unauthenticated, api.envest.evari.tech returns 502, and
  the customer and admin applications are login walls. Evari is a consumer of other
  vendors' APIs (Socotra, Vertafore AMS360/Sagitta, Applied Epic, Guidewire read
  access) rather than a publisher of its own, and no ACORD, AL3 or IVANS reference
  appears anywhere on its site or in its help centre.
