info:
    description: 'The documentation for the Evari Quotes API'
    license:
        name: UNLICENSED
    title: 'Evari Quotes API'
    version: 0.1.0
paths:
    /api/quotes/health/diagnostics:
        get:
            operationId: HealthDiagnostics
            produces:
                - application/json
            responses:
                '200':
                    description: Ok
                    schema:
                        $ref: '#/definitions/DiagnosticsResponse'
            description: 'Send a detailed system diagnostics response message.'
            security:
                -
                    default: []
            parameters: []
    /api/quotes/health:
        get:
            operationId: HealthHealthCheck
            produces:
                - application/json
            responses:
                '200':
                    description: Ok
                    schema:
                        $ref: '#/definitions/HealthResponse'
            description: "Send a health response message.\n200 OK or nothing - no other information"
            parameters: []
    /api/quotes/search/quotes:
        get:
            operationId: QuoteSearch
            produces:
                - application/json
            responses:
                '200':
                    description: Ok
                    schema:
                        $ref: '#/definitions/QuoteListResponse'
            description: ""
            security:
                -
                    default: []
            parameters:
                -
                    description: ""
                    in: query
                    name: q
                    required: true
                    type: string
                -
                    description: 'The starting position to retrieve data from'
                    in: query
                    name: offset
                    required: true
                    type: number
                    format: double
                -
                    description: 'The number of item to retrieve'
                    in: query
                    name: limit
                    required: true
                    type: number
                    format: double
                -
                    description: 'The column name to sort'
                    in: query
                    name: sort
                    required: false
                    type: string
                -
                    description: 'The order of sort'
                    in: query
                    name: order
                    required: false
                    type: string
                    enum:
                        - ASC
                        - DESC
    '/api/quotes/products/{productId}/quotes/count':
        get:
            operationId: QuoteCount
            produces:
                - application/json
            responses:
