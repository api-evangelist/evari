actions:
  openapiHarvested: false
  specsSaved: 0
  apisYmlEntries: 0
  reason: |
    No real, public, self-serve API surface exists to record. apis[] is
    deliberately empty. Recording the absence accurately - a core-systems
    insurance vendor whose only integration path is a sales-led,
    tenant-scoped deployment behind a login wall, with no ACORD posture at
    all - is the finding.
