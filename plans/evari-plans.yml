metering:
  unit: transaction
  definition: A single unit of work processed by an assistant — one submission
    processed, one renewal handled, one email triaged.
  secondary_unit: AI credits
  overage_policy: No overage billing. Usage alerts fire as storage or credit limits
    approach; the customer upgrades tier, which takes effect instantly.
sales_motion:
