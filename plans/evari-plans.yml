model: |
  Two-part commercial model: a fixed-price delivery sprint up front, then a recurring
  platform subscription banded by daily transaction volume. There is no free tier, no
  self-serve API plan and no published per-call pricing — account creation itself is
  directed to the third-party QuivaWorks platform at quiva.ai.
